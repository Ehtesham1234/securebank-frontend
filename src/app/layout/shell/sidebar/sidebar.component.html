<nav class="flex h-full flex-col gap-1 p-4">
  <a routerLink="/dashboard" class="mb-6 inline-flex items-baseline gap-2 px-2">
    <span class="font-display text-xl font-medium text-white">SecureBank</span>
    <span class="text-[10px] uppercase tracking-[0.2em] text-gold-400">Vault</span>
  </a>

  @for (item of items(); track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="bg-white/10 text-white before:opacity-100"
      class="relative flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-ink-200 transition-colors before:absolute before:-left-4 before:top-1/2 before:h-5 before:w-1 before:-translate-y-1/2 before:rounded-full before:bg-gold-500 before:opacity-0 before:transition-opacity hover:bg-white/5 hover:text-white"
    >
      <i [class]="item.icon"></i>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
