<ul class="mt-2 space-y-1 text-sm">
  @for (rule of rules(); track rule.key) {
    <li
      class="flex items-center gap-2 transition-colors"
      [class.text-primary-600]="rule.met"
      [class.text-ink-400]="!rule.met"
    >
      <i class="pi text-xs" [class.pi-check-circle]="rule.met" [class.pi-circle]="!rule.met"></i>
      <span>{{ rule.label }}</span>
    </li>
  }
</ul>
