<h1 class="font-display text-2xl font-medium text-ink-900">All users</h1>
<p class="mt-1 text-sm text-ink-400">Every registered user.</p>

<div class="mt-4 flex gap-2">
  <input
    pInputText
    placeholder="Search by name or email"
    class="w-72"
    [value]="searchTerm()"
    (input)="onSearchInput($event)"
    (keyup.enter)="submitSearch()"
  />
  <p-button label="Search" (onClick)="submitSearch()" />
</div>

<div class="mt-6 overflow-hidden rounded-md border border-ink-100 bg-white">
  <p-table [value]="service.users()" [loading]="service.loading()" dataKey="id" styleClass="w-full">
    <ng-template pTemplate="header">
      <tr>
        <th class="text-left">Name</th>
        <th class="text-left">Email</th>
        <th class="text-left">Role</th>
        <th class="text-left">Status</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.firstName }} {{ user.lastName }}</td>
        <td>{{ user.email }}</td>
        <td><p-tag [value]="user.role" [severity]="roleSeverity(user.role)" /></td>
        <td><p-tag [value]="user.userStatus" [severity]="statusSeverity(user.userStatus)" /></td>
        <td class="text-right">
          <p-button label="View" size="small" [text]="true" (onClick)="openUser(user.id)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="py-8 text-center text-sm text-ink-400">No users found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

@if (service.hasMore()) {
  <div class="mt-4 flex justify-center">
    <p-button
      label="Load more"
      severity="secondary"
      [text]="true"
      [loading]="service.loadingMore()"
      (onClick)="service.loadMore()"
    />
  </div>
}
