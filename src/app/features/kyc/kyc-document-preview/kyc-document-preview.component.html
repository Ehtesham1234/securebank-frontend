<div class="overflow-hidden rounded-md border border-ink-100 bg-ink-50">
  @if (loading()) {
    <div class="flex h-64 items-center justify-center">
      <i class="pi pi-spin pi-spinner text-xl text-ink-400"></i>
    </div>
  } @else if (loadError()) {
    <div class="flex h-64 flex-col items-center justify-center gap-2 text-sm text-ink-400">
      <i class="pi pi-exclamation-circle text-xl"></i>
      <span>Couldn't load the document.</span>
    </div>
  } @else {
    @if (safeUrl(); as url) {
      @if (isPdf()) {
        <embed [src]="url" type="application/pdf" class="h-96 w-full" />
      } @else {
        <img [src]="url" alt="Submitted KYC document" class="max-h-96 w-full object-contain" />
      }
    }
  }
</div>
