<h1 class="font-display text-2xl font-medium text-ink-900">All loans</h1>
<p class="mt-1 text-sm text-ink-400">Every loan, any status, across every customer.</p>

<div class="mt-4 flex flex-wrap items-center gap-2">
  <select
    class="rounded-md border border-ink-200 px-3 py-2 text-sm text-ink-900"
    [value]="searchField()"
    (change)="onSearchFieldChange($event)"
  >
    <option value="search">Name or email</option>
    <option value="userId">User ID</option>
    <option value="loanId">Loan ID</option>
    <option value="loanRef">Loan ref</option>
  </select>
  <input
    pInputText
    placeholder="Search..."
    class="w-64"
    [value]="searchValue()"
    (input)="onSearchValueInput($event)"
    (keyup.enter)="submitSearch()"
  />
  <p-button label="Search" (onClick)="submitSearch()" />
  <p-button label="Clear" severity="secondary" [text]="true" (onClick)="clearSearch()" />
</div>

<div class="mt-6 overflow-hidden rounded-md border border-ink-100 bg-white">
  <p-table [value]="service.allLoans()" [loading]="service.allLoansLoading()" dataKey="id" styleClass="w-full">
    <ng-template pTemplate="header">
      <tr>
        <th class="text-left">Ref</th>
        <th class="text-left">User</th>
        <th class="text-left">Type</th>
        <th class="text-left">Amount</th>
        <th class="text-left">Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-loan>
      <tr>
        <td class="font-ledger">{{ loan.loanRef }}</td>
        <td>User #{{ loan.userId }}</td>
        <td>{{ loan.loanType.replace('_', ' ') }}</td>
        <td class="font-ledger">{{ loan.principalAmount | currency: 'INR' }}</td>
        <td>
          <p-tag [value]="loan.status" [severity]="statusSeverity(loan.status)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="py-8 text-center text-sm text-ink-400">No loans found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

@if (service.allLoansHasMore()) {
  <div class="mt-4 flex justify-center">
    <p-button
      label="Load more"
      severity="secondary"
      [text]="true"
      [loading]="service.allLoansLoadingMore()"
      (onClick)="service.loadMoreAll()"
    />
  </div>
}
