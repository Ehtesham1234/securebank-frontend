<h1 class="font-display text-2xl font-medium text-ink-900">Set a new password</h1>
<p class="mt-1 text-sm text-ink-400">Enter the code we sent to your email.</p>

<form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 flex flex-col gap-5">
  <div>
    <label for="email" class="mb-1.5 block text-sm font-medium text-ink-600">Email</label>
    <input pInputText id="email" type="email" formControlName="email" class="w-full" autocomplete="email" />
  </div>

  <div>
    <label for="otp" class="mb-1.5 block text-sm font-medium text-ink-600">Verification code</label>
    <input
      pInputText
      id="otp"
      formControlName="otp"
      class="font-ledger w-full tracking-widest"
      inputmode="numeric"
      maxlength="6"
      autocomplete="one-time-code"
    />
    @if (otpError(); as msg) {
      <p class="mt-1 text-xs text-red-600">{{ msg }}</p>
    }
  </div>

  <div>
    <label for="newPassword" class="mb-1.5 block text-sm font-medium text-ink-600">New password</label>
    <p-password
      inputId="newPassword"
      formControlName="newPassword"
      [toggleMask]="true"
      [feedback]="false"
      styleClass="w-full"
      inputStyleClass="w-full"
      autocomplete="new-password"
    />
    <sb-password-checklist [value]="form.controls.newPassword.value" />
  </div>

  <div>
    <label for="confirmPassword" class="mb-1.5 block text-sm font-medium text-ink-600">
      Confirm new password
    </label>
    <p-password
      inputId="confirmPassword"
      formControlName="confirmPassword"
      [toggleMask]="true"
      [feedback]="false"
      styleClass="w-full"
      inputStyleClass="w-full"
      autocomplete="new-password"
    />
    @if (form.controls.confirmPassword.errors?.['mismatch'] && form.controls.confirmPassword.touched) {
      <p class="mt-1 text-xs text-red-600">Passwords don't match.</p>
    }
  </div>

  <p-button
    type="submit"
    label="Set new password"
    styleClass="w-full justify-center"
    [loading]="submitting()"
    [disabled]="form.invalid || submitting()"
  />
</form>

<p class="mt-6 text-center text-sm text-ink-400">
  <a routerLink="/auth/login" class="font-medium text-primary-600 hover:underline">Back to log in</a>
</p>
